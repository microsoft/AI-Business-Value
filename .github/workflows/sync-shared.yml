name: sync-shared

on:
  push:
    paths:
      - '3. Fabric/pipelines/**'
      - '3. Fabric/notebooks/**'
      - '3. Fabric/archive/extended/**/notebooks/_core/**'
      - '3. Fabric/archive/extended/_shared/notebooks/**'
      - '3. Fabric/archive/flows/**'
      - '3. Fabric/*.pbit'
      - 'tests/**'
      - 'scripts/sync-shared.ps1'
      - '.github/workflows/sync-shared.yml'
  pull_request:
    paths:
      - '3. Fabric/pipelines/**'
      - '3. Fabric/notebooks/**'
      - '3. Fabric/archive/extended/**/notebooks/_core/**'
      - '3. Fabric/archive/extended/_shared/notebooks/**'
      - '3. Fabric/archive/flows/**'
      - '3. Fabric/*.pbit'
      - 'tests/**'
      - 'scripts/sync-shared.ps1'
      - '.github/workflows/sync-shared.yml'

jobs:
  check-shared:
    name: Verify _core / _shared notebooks match 3. Fabric/notebooks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run sync-shared in check mode
        shell: pwsh
        run: |
          ./scripts/sync-shared.ps1 -Check
      - name: Check core templates and notebook distribution
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -v
