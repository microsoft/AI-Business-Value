name: sync-shared

on:
  push:
    paths:
      - '3. Fabric/notebooks/**'
      - '3. Fabric/extended/**/notebooks/_core/**'
      - '3. Fabric/extended/_shared/notebooks/**'
      - '3. Fabric/*.pbit'
      - 'tests/**'
      - 'scripts/sync-shared.ps1'
      - '.github/workflows/sync-shared.yml'
  pull_request:
    paths:
      - '3. Fabric/notebooks/**'
      - '3. Fabric/extended/**/notebooks/_core/**'
      - '3. Fabric/extended/_shared/notebooks/**'
      - '3. Fabric/*.pbit'
      - 'tests/**'
      - 'scripts/sync-shared.ps1'
      - '.github/workflows/sync-shared.yml'

jobs:
  check-shared:
    name: Verify _core / _shared notebooks match 3. Fabric/notebooks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sync-shared in check mode
        shell: pwsh
        run: |
          ./scripts/sync-shared.ps1 -Check
      - name: Check core templates and notebook distribution
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -v
